<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comptes Starlink clients</title>
<meta name="theme-color" content="#15263D">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#EEF2F5;--surface:#FFFFFF;--ink:#15263D;--muted:#5B6B80;--line:#D5DDE6;
  --accent:#E07B00;--accent-ink:#FFFFFF;--ok:#1E8A52;--warn:#B87400;--bad:#C23B2E;
  --ok-bg:#E3F3EA;--warn-bg:#FBF0DC;--bad-bg:#F8E3E0;--track:#E3E9EF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1826;--surface:#172234;--ink:#E6ECF3;--muted:#93A3B8;--line:#2A3A52;
    --accent:#F08C14;--accent-ink:#1A1206;--ok:#4CC486;--warn:#E7A93A;--bad:#EE6E60;
    --ok-bg:#16352A;--warn-bg:#3A2E15;--bad-bg:#3D1F1C;--track:#24324A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1826;--surface:#172234;--ink:#E6ECF3;--muted:#93A3B8;--line:#2A3A52;
  --accent:#F08C14;--accent-ink:#1A1206;--ok:#4CC486;--warn:#E7A93A;--bad:#EE6E60;
  --ok-bg:#16352A;--warn-bg:#3A2E15;--bad-bg:#3D1F1C;--track:#24324A;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 10px;font-size:.87rem}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}

.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.stat{padding:14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .v{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
.stat .l{color:var(--muted);font-size:.88rem}
.stat.warn .v{color:var(--warn)}.stat.bad .v{color:var(--bad)}.stat.ok .v{color:var(--ok)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1.6fr 1.5fr 1.35fr 1fr auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{color:var(--muted);font-size:.85rem;font-weight:600;padding-top:10px;padding-bottom:10px;background:transparent}
.name{font-weight:700}
.meta{color:var(--muted);font-size:.87rem;overflow-wrap:anywhere}
.pwd{display:flex;align-items:center;gap:6px;font-size:.87rem;color:var(--muted)}
.pwd code{font-family:inherit;color:var(--ink)}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:4px;font-size:.82rem;text-decoration:underline}
.icon-btn:hover{color:var(--ink)}

/* signature: cycle gauge */
.gauge{display:flex;flex-direction:column;gap:5px}
.gauge .date{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.left{font-size:.85rem;font-weight:600}
.s-ok .bar i{background:var(--ok)}.s-ok .left{color:var(--ok)}
.s-warn .bar i{background:var(--warn)}.s-warn .left{color:var(--warn)}
.s-bad .bar i{background:var(--bad)}.s-bad .left{color:var(--bad)}

.money{font-size:.9rem}
.money .m{font-weight:700;color:var(--ok)}
.money .m.neg{color:var(--bad)}
.paid{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-top:3px}
.paid.yes{background:var(--ok-bg);color:var(--ok)}
.paid.no{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

.foot{margin-top:14px;color:var(--muted);font-size:.85rem}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,18,30,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:1.2rem}
.dlg-body{padding:18px 20px;overflow:auto}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot .r{display:flex;gap:8px;margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;font-weight:400}
label.f textarea{min-height:64px;resize:vertical}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.section-t{font-weight:700;margin:18px 0 8px;font-size:.95rem}
.hist{width:100%;border-collapse:collapse;font-size:.87rem}
.hist td,.hist th{padding:6px 8px;border-top:1px solid var(--line);text-align:left}
.hist th{color:var(--muted);font-weight:600;border-top:0}
.table-scroll{overflow-x:auto}
.marge-live{font-size:.9rem;color:var(--muted)}
.marge-live b{color:var(--ok)}

.banner{display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.banner.on{display:flex}
.banner p{margin:0}
.err{color:var(--bad);font-size:.88rem;font-weight:600;min-height:1.2em;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:820px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .row.head{display:none}
  .row{grid-template-columns:1fr 1fr;gap:10px 14px}
  .row .c-id{grid-column:1/-1}
  .row .c-acct{grid-column:1/-1}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- marque ---- */
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;flex:none;border-radius:12px}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.btn.wa{color:var(--ok)}
.fab{display:none}

/* ---- téléphone ---- */
@media (max-width:820px){
  .wrap{padding:12px 12px 110px}
  header.top{margin-bottom:12px}
  h1{font-size:1.3rem}
  .brand svg{width:40px;height:40px}
  .sub{font-size:.85rem}
  .top-actions{width:100%}
  .top-actions #btnAdd{display:none}
  .top-actions .btn{flex:1;padding:10px 8px;font-size:.9rem}
  .stats{margin-bottom:12px}
  .stat{padding:10px 14px}
  .stat .v{font-size:1.3rem}
  .toolbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;padding:8px 0;margin:0 0 6px}
  .search{padding:12px}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .chip{white-space:nowrap;padding:9px 15px}
  .list{background:transparent;border:0;border-radius:0;overflow:visible}
  .row,.row:first-child{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:14px}
  .acts{flex-wrap:wrap}
  .btn.small{flex:1 1 40%;padding:11px 10px;font-size:.93rem}
  .icon-btn{padding:6px 8px;font-size:.88rem}
  input,select,textarea{font-size:16px!important}
  dialog{width:100vw;max-width:100vw;max-height:92%;margin:auto 0 0 0;border-radius:18px 18px 0 0;border-bottom:0}
  .dlg-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .dlg-foot .btn{padding:12px 16px}
  .fab{display:flex;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:32px;line-height:1;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:5;cursor:pointer}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="#15263D"/><path d="M13 27a22 22 0 0 1 38 0" fill="none" stroke="#E07B00" stroke-width="4" stroke-linecap="round"/><path d="M20 31a14 14 0 0 1 24 0" fill="none" stroke="#E07B00" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="37" r="4.5" fill="#E07B00"/><path d="M32 41v10M25 51h14" stroke="#EEF2F5" stroke-width="3.5" stroke-linecap="round"/></svg>
      <div>
      <h1>Comptes Starlink clients</h1>
      <p class="sub">Abonnements payés pour vos clients : échéances, prix et bénéfice. Fonctionne sans Internet.</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnExport">Sauvegarder</button>
      <button class="btn" id="btnImport">Restaurer</button>
      <button class="btn primary" id="btnAdd">Ajouter un client</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="stats" aria-label="Résumé">
    <div class="stat"><div class="v" id="stActive">0</div><div class="l">Abonnements actifs</div></div>
    <div class="stat warn"><div class="v" id="stSoon">0</div><div class="l">À renouveler sous 7 jours</div></div>
    <div class="stat bad"><div class="v" id="stExp">0</div><div class="l">Expirés</div></div>
    <div class="stat ok"><div class="v" id="stProfit">0</div><div class="l">Bénéfice mensuel (actifs)</div></div>
  </section>

  <div class="banner" id="banner"><p id="bannerText"></p><button class="btn primary small" id="bannerBtn"></button></div>

  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Rechercher un client…" aria-label="Rechercher">
    <div class="chips" role="group" aria-label="Filtrer">
      <button class="chip" data-f="all" aria-pressed="true">Tous</button>
      <button class="chip" data-f="ok" aria-pressed="false">Actifs</button>
      <button class="chip" data-f="warn" aria-pressed="false">Bientôt</button>
      <button class="chip" data-f="bad" aria-pressed="false">Expirés</button>
      <button class="chip" data-f="unpaid" aria-pressed="false">Non payés</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <p class="foot" id="foot"></p>
</div>

<!-- Client form -->
<dialog id="dlgClient">
  <form method="dialog" id="formClient">
    <div class="dlg-head"><h2 id="dlgTitle">Nouveau client</h2><button type="button" class="btn ghost" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body">
      <div class="grid">
        <label class="f">Nom du client<input name="nom" required></label>
        <label class="f">Téléphone<input name="tel" type="tel"></label>
        <label class="f full">Email du compte Starlink<input name="email" type="email" autocomplete="off"></label>
        <label class="f full">Mot de passe Starlink
          <input name="mdp" type="text" autocomplete="off" spellcheck="false">
          <span class="hint">Gardé sur cet appareil. Utilisez « Sauvegarder » pour le transférer vers un autre appareil.</span>
        </label>
        <label class="f">N° de compte / kit<input name="kit" placeholder="ACC-… ou n° de série"></label>
        <label class="f">Forfait
          <select name="forfait">
            <option>Résidentiel</option><option>Résidentiel Lite</option><option>Roam (Itinérance)</option><option>Entreprise</option><option>Autre</option>
          </select>
        </label>
        <label class="f">Date d'ouverture du compte<input name="ouverture" type="date"></label>
        <label class="f">Fin d'abonnement<input name="fin" type="date" required></label>
        <label class="f">Prix Starlink (ce que vous payez)<input name="prixStarlink" type="number" min="0" step="1" inputmode="numeric"></label>
        <label class="f">Prix client (ce qu'il vous paie)<input name="prixClient" type="number" min="0" step="1" inputmode="numeric"></label>
        <div class="full marge-live" id="margeLive"></div>
        <label class="check full"><input type="checkbox" name="paye"> Le client a payé ce mois</label>
        <label class="f full">Notes<textarea name="notes" placeholder="Lieu d'installation, mode de paiement du client…"></textarea></label>
      </div>
      <div id="histWrap"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn danger" id="btnDelete">Supprimer</button>
      <div class="r"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>
    </div>
  </form>
</dialog>

<!-- Renew -->
<dialog id="dlgRenew">
  <form method="dialog" id="formRenew">
    <div class="dlg-head"><h2 id="renewTitle">Renouveler</h2><button type="button" class="btn ghost" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body">
      <div class="grid">
        <label class="f">Nouvelle fin d'abonnement<input name="fin" type="date" required></label>
        <label class="f">Payé le<input name="date" type="date" required></label>
        <label class="f">Prix Starlink payé<input name="prixStarlink" type="number" min="0" step="1" inputmode="numeric"></label>
        <label class="f">Prix client<input name="prixClient" type="number" min="0" step="1" inputmode="numeric"></label>
        <label class="check full"><input type="checkbox" name="paye"> Le client a déjà payé</label>
      </div>
    </div>
    <div class="dlg-foot"><div class="r"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Renouveler</button></div></div>
  </form>
</dialog>

<!-- Code secret -->
<dialog id="dlgLock">
  <form method="dialog" id="formLock">
    <div class="dlg-head"><h2 id="lockTitle">Code secret</h2><button type="button" class="btn ghost" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body">
      <p id="lockIntro" style="margin-top:0"></p>
      <div class="grid">
        <label class="f full">Code secret<input name="code" type="password" autocomplete="off" minlength="4" required></label>
        <label class="f full" id="lockConfirmWrap">Confirmer le code<input name="code2" type="password" autocomplete="off"></label>
        <label class="check full"><input type="checkbox" name="remember" checked> Se souvenir du code sur cet appareil</label>
      </div>
      <p class="err" id="lockErr"></p>
    </div>
    <div class="dlg-foot"><div class="r"><button type="button" class="btn" data-close>Plus tard</button><button type="submit" class="btn primary" id="lockSubmit">Valider</button></div></div>
  </form>
</dialog>

<button class="fab" id="fab" aria-label="Ajouter un client">+</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const LS_DATA="slk_clients_v1", LS_PWD="slk_pwd_v1";
  let clients=[];           // {id, nom, tel, email, kit, forfait, ouverture, fin, prixStarlink, prixClient, paye, notes, hist:[]}
  let pwds={};              // id -> password (device only)
  let db=null, coll=null, uid=null;
  let filter="all", query="", editingId=null, renewId=null;
  const shown=new Set();

  const $=s=>document.querySelector(s);
  const fmt=n=>(Math.round(Number(n)||0)).toLocaleString("fr-FR")+" F";
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
  const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
  const parse=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
  const addMonth=s=>{const d=parse(s)||today();const day=d.getDate();d.setMonth(d.getMonth()+1);if(d.getDate()<day)d.setDate(0);return iso(d)};
  const frDate=s=>{const d=parse(s);return d?d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"—"};
  const daysLeft=c=>{const f=parse(c.fin);return f?Math.round((f-today())/86400000):-9999};
  const status=c=>{const n=daysLeft(c);return n<0?"bad":n<=7?"warn":"ok"};
  const newId=()=>"c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200)}

  // ---------- storage ----------
  function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function savePwds(){lsSet(LS_PWD,pwds)}
  pwds=lsGet(LS_PWD,{});
  clients=lsGet(LS_DATA,[]);
  render();

  // ---------- chiffrement des mots de passe (AES-GCM, clé dérivée du code secret) ----------
  const LS_CODE="slk_code_v1", VERIF="starlink-ok";
  let settings=null, key=null;
  const te=new TextEncoder(), td=new TextDecoder();
  const b64=u=>{let s="";new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function deriveKey(code,salt){
    const base=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  }
  async function encStr(s,k=key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,te.encode(s));return {iv:b64(iv),ct:b64(ct)}}
  async function decStr(o,k=key){return td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},k,unb64(o.ct)))}

  // Ajoute la version chiffrée du mot de passe au client ("" = effacé volontairement)
  async function withEnc(c){
    if(!key)return c;
    const pw=pwds[c.id];
    return {...c,mdpEnc:pw?await encStr(pw):""};
  }
  async function decryptAll(){
    if(!key)return;
    const toUpload=[];
    for(const c of clients){
      if(c.mdpEnc&&c.mdpEnc.ct){ try{pwds[c.id]=await decStr(c.mdpEnc)}catch(e){} }
      else if(c.mdpEnc==="") delete pwds[c.id];
      else if(pwds[c.id]) toUpload.push(c); // mot de passe resté local : on l'envoie chiffré
    }
    savePwds();
    for(const c of toUpload){ const u=await withEnc(c); clients=clients.map(x=>x.id===u.id?u:x); await persist(u); }
  }
  async function tryUnlock(code){
    if(!settings)return false;
    try{ const k=await deriveKey(code,settings.salt); if(await decStr(settings.verif,k)!==VERIF)return false; key=k; return true; }catch(e){return false}
  }
  function updateBanner(){
    const b=$("#banner");
    if(!coll||key){b.classList.remove("on");return}
    b.classList.add("on");
    if(!settings){ $("#bannerText").textContent="Créez un code secret pour retrouver les mots de passe Starlink sur votre téléphone et votre ordinateur."; $("#bannerBtn").textContent="Créer le code"; }
    else{ $("#bannerText").textContent="Les mots de passe sont verrouillés sur cet appareil. Entrez votre code secret pour les afficher."; $("#bannerBtn").textContent="Déverrouiller"; }
  }

  async function persist(c){
    if(coll){ try{ await coll.doc(c.id).set(stripId(c)); }catch(e){ toast("Échec de l'enregistrement en ligne — gardé localement"); } }
    lsSet(LS_DATA,clients);
  }
  async function remove(id){
    if(coll){ try{ await coll.doc(id).delete(); }catch(e){} }
    lsSet(LS_DATA,clients);
  }
  function stripId(c){const o={...c};delete o.id;return o}

  (async function initDb(){
    if(!window.claude||!window.claude.use)return;
    try{
      const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!d||!u)return;
      uid=await u.id(); if(!uid)return;
      db=d; coll=db.collection("data/users/"+uid);
      let first=true;
      coll.onSnapshot(async snap=>{
        const sd=snap.docs.find(x=>x.id==="settings"&&x.exists);
        settings=sd?sd.data():null;
        const remote=snap.docs.filter(x=>x.exists&&x.id.startsWith("c_")).map(x=>({id:x.id,...x.data()}));
        if(first){
          first=false;
          // First sync: push local-only clients up (migration from browser storage)
          const ids=new Set(remote.map(r=>r.id));
          const localOnly=clients.filter(c=>!ids.has(c.id));
          for(const c of localOnly){ try{await coll.doc(c.id).set(stripId(c)); remote.push(c);}catch(e){} }
        }
        clients=remote; lsSet(LS_DATA,clients);
        if(!key&&settings){ const saved=lsGet(LS_CODE,null); if(saved&&!(await tryUnlock(saved))) try{localStorage.removeItem(LS_CODE)}catch(e){} }
        if(key) await decryptAll();
        render(); updateBanner();
      },()=>{ $("#foot").textContent="Synchronisation en ligne indisponible — données gardées sur cet appareil."; });
    }catch(e){}
  })();

  // ---------- render ----------
  function render(){
    const act=clients.filter(c=>status(c)!=="bad");
    $("#stActive").textContent=act.length;
    $("#stSoon").textContent=clients.filter(c=>status(c)==="warn").length;
    $("#stExp").textContent=clients.filter(c=>status(c)==="bad").length;
    $("#stProfit").textContent=fmt(act.reduce((s,c)=>s+(+c.prixClient||0)-(+c.prixStarlink||0),0));

    const q=query.trim().toLowerCase();
    let rows=clients.filter(c=>{
      if(filter==="unpaid"&&c.paye)return false;
      if(["ok","warn","bad"].includes(filter)&&status(c)!==filter)return false;
      if(!q)return true;
      return [c.nom,c.email,c.tel,c.kit,c.notes].some(v=>String(v||"").toLowerCase().includes(q));
    }).sort((a,b)=>daysLeft(a)-daysLeft(b));

    const list=$("#list");
    if(!clients.length){
      list.innerHTML='<div class="empty"><strong>Aucun client pour l\'instant</strong>Ajoutez votre premier compte Starlink pour suivre ses échéances.<br><br><button class="btn primary" data-act="add">Ajouter un client</button></div>';
      $("#foot").textContent=""; return;
    }
    if(!rows.length){ list.innerHTML='<div class="empty"><strong>Aucun résultat</strong>Changez le filtre ou la recherche.</div>'; return; }

    let h='<div class="row head"><div>Client</div><div>Compte Starlink</div><div>Fin d\'abonnement</div><div>Prix / bénéfice</div><div></div></div>';
    for(const c of rows){
      const n=daysLeft(c), s=status(c);
      const pct=Math.max(0,Math.min(100,(n/30)*100));
      const left=n<0?`Expiré depuis ${-n} j`:n===0?"Expire aujourd'hui":`${n} j restants`;
      const marge=(+c.prixClient||0)-(+c.prixStarlink||0);
      const pw=pwds[c.id]||"";
      const pwHtml=pw?`<div class="pwd">Mot de passe : <code>${shown.has(c.id)?esc(pw):"••••••••"}</code><button class="icon-btn" data-act="eye" data-id="${c.id}">${shown.has(c.id)?"masquer":"voir"}</button><button class="icon-btn" data-act="copy" data-id="${c.id}">copier</button></div>`:(c.mdpEnc&&c.mdpEnc.ct?'<div class="pwd">Mot de passe verrouillé <button class="icon-btn" data-act="unlock">déverrouiller</button></div>':'<div class="pwd">Aucun mot de passe enregistré</div>');
      h+=`<div class="row">
        <div class="c-id"><div class="name">${esc(c.nom)}</div><div class="meta">${esc(c.tel||"")}${c.tel&&c.forfait?" — ":""}${esc(c.forfait||"")}</div><div class="meta">Ouvert le ${frDate(c.ouverture)}</div></div>
        <div class="c-acct"><div class="meta" style="color:var(--ink)">${esc(c.email||"—")}</div>${pwHtml}${c.kit?`<div class="meta">${esc(c.kit)}</div>`:""}</div>
        <div class="gauge s-${s}"><span class="date">${frDate(c.fin)}</span><div class="bar"><i style="width:${s==="bad"?100:pct}%"></i></div><span class="left">${left}</span></div>
        <div class="money"><div>${fmt(c.prixStarlink)} → ${fmt(c.prixClient)}</div><div>Bénéfice <span class="m ${marge<0?"neg":""}">${fmt(marge)}</span></div><span class="paid ${c.paye?"yes":"no"}">${c.paye?"Payé":"Non payé"}</span></div>
        <div class="acts">${c.tel?`<a class="btn small" href="tel:${esc(c.tel.replace(/[^\d+]/g,""))}">Appeler</a><a class="btn small wa" href="${waLink(c)}" target="_blank" rel="noopener">WhatsApp</a>`:""}<button class="btn small" data-act="renew" data-id="${c.id}">Renouveler</button><button class="btn small" data-act="edit" data-id="${c.id}">Modifier</button></div>
      </div>`;
    }
    list.innerHTML=h;
    const tot=clients.length;
    $("#foot").textContent=`${rows.length} sur ${tot} client${tot>1?"s":""}. Trié par échéance la plus proche.`;
  }

  // Lien WhatsApp avec rappel d'échéance (numéros à 8 chiffres = Niger, +227)
  function waLink(c){
    let d=String(c.tel||"").replace(/\D/g,""); if(d.startsWith("00"))d=d.slice(2); if(d.length===8)d="227"+d;
    const n=daysLeft(c);
    const quand=n<0?`a expiré le ${frDate(c.fin)}`:`expire le ${frDate(c.fin)}`;
    const msg=`Bonjour ${c.nom}, votre abonnement Starlink ${quand}. Montant du renouvellement : ${fmt(c.prixClient)}. Merci.`;
    return "https://wa.me/"+d+"?text="+encodeURIComponent(msg);
  }

  // ---------- form ----------
  const fc=$("#formClient"), dc=$("#dlgClient");
  function updMarge(){const m=(+fc.prixClient.value||0)-(+fc.prixStarlink.value||0);$("#margeLive").innerHTML=(fc.prixClient.value||fc.prixStarlink.value)?`Bénéfice par mois : <b style="color:${m<0?"var(--bad)":"var(--ok)"}">${fmt(m)}</b>`:""}
  fc.prixClient.addEventListener("input",updMarge);fc.prixStarlink.addEventListener("input",updMarge);

  function openForm(id){
    editingId=id||null; fc.reset();
    const c=clients.find(x=>x.id===id);
    $("#dlgTitle").textContent=c?c.nom:"Nouveau client";
    $("#btnDelete").style.visibility=c?"visible":"hidden";
    if(c){
      for(const k of ["nom","tel","email","kit","forfait","ouverture","fin","prixStarlink","prixClient","notes"]) fc[k].value=c[k]??"";
      fc.paye.checked=!!c.paye; fc.mdp.value=pwds[c.id]||"";
    }else{
      fc.ouverture.value=iso(today()); fc.fin.value=addMonth(iso(today()));
    }
    const hist=(c&&c.hist)||[];
    $("#histWrap").innerHTML=hist.length?`<div class="section-t">Historique des paiements</div><div class="table-scroll"><table class="hist"><tr><th>Date</th><th>Jusqu'au</th><th>Starlink</th><th>Client</th><th>Bénéfice</th></tr>${hist.slice().reverse().map(p=>`<tr><td>${frDate(p.date)}</td><td>${frDate(p.fin)}</td><td>${fmt(p.prixStarlink)}</td><td>${fmt(p.prixClient)}</td><td>${fmt((+p.prixClient||0)-(+p.prixStarlink||0))}</td></tr>`).join("")}</table></div>`:"";
    updMarge(); dc.showModal(); fc.nom.focus();
  }

  fc.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!fc.nom.value.trim()||!fc.fin.value){fc.reportValidity();return}
    const prev=clients.find(x=>x.id===editingId);
    let c={id:editingId||newId(),mdpEnc:prev?prev.mdpEnc:undefined,nom:fc.nom.value.trim(),tel:fc.tel.value.trim(),email:fc.email.value.trim(),kit:fc.kit.value.trim(),forfait:fc.forfait.value,ouverture:fc.ouverture.value,fin:fc.fin.value,prixStarlink:+fc.prixStarlink.value||0,prixClient:+fc.prixClient.value||0,paye:fc.paye.checked,notes:fc.notes.value.trim(),hist:prev?.hist||[]};
    if(!prev) c.hist=[{date:c.ouverture||iso(today()),fin:c.fin,prixStarlink:c.prixStarlink,prixClient:c.prixClient}];
    const mdp=fc.mdp.value, mdpChanged=mdp!==(pwds[c.id]||"");
    if(mdp)pwds[c.id]=mdp; else delete pwds[c.id]; savePwds();
    if(c.mdpEnc===undefined) delete c.mdpEnc;
    if(key&&mdpChanged) c=await withEnc(c);
    if(prev) clients=clients.map(x=>x.id===c.id?c:x); else clients.push(c);
    dc.close(); render(); await persist(c); toast(prev?"Client enregistré":"Client ajouté");
    if(coll&&!key&&mdp&&mdpChanged) setTimeout(()=>openLock(),600);
  });

  $("#btnDelete").addEventListener("click",async()=>{
    const c=clients.find(x=>x.id===editingId); if(!c)return;
    if(!confirm(`Supprimer ${c.nom} et son historique ?`))return;
    clients=clients.filter(x=>x.id!==c.id); delete pwds[c.id]; savePwds();
    dc.close(); render(); await remove(c.id); toast("Client supprimé");
  });

  // ---------- renew ----------
  const fr=$("#formRenew"), dr=$("#dlgRenew");
  function openRenew(id){
    const c=clients.find(x=>x.id===id); if(!c)return; renewId=id; fr.reset();
    $("#renewTitle").textContent="Renouveler — "+c.nom;
    const base=daysLeft(c)<0?iso(today()):c.fin;
    fr.fin.value=addMonth(base); fr.date.value=iso(today());
    fr.prixStarlink.value=c.prixStarlink||""; fr.prixClient.value=c.prixClient||"";
    dr.showModal();
  }
  fr.addEventListener("submit",async e=>{
    e.preventDefault();
    const c=clients.find(x=>x.id===renewId); if(!c)return;
    const p={date:fr.date.value,fin:fr.fin.value,prixStarlink:+fr.prixStarlink.value||0,prixClient:+fr.prixClient.value||0};
    const u={...c,fin:p.fin,prixStarlink:p.prixStarlink,prixClient:p.prixClient,paye:fr.paye.checked,hist:[...(c.hist||[]),p]};
    clients=clients.map(x=>x.id===u.id?u:x);
    dr.close(); render(); await persist(u); toast("Abonnement renouvelé jusqu'au "+frDate(p.fin));
  });

  document.querySelectorAll("dialog [data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));

  // ---------- events ----------
  $("#btnAdd").addEventListener("click",()=>openForm());
  $("#fab").addEventListener("click",()=>openForm());
  $("#q").addEventListener("input",e=>{query=e.target.value;render()});
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    filter=ch.dataset.f; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===ch?"true":"false")); render();
  }));
  $("#list").addEventListener("click",async e=>{
    const b=e.target.closest("[data-act]"); if(!b)return;
    const id=b.dataset.id, a=b.dataset.act;
    if(a==="add")openForm();
    else if(a==="edit")openForm(id);
    else if(a==="renew")openRenew(id);
    else if(a==="unlock")openLock();
    else if(a==="eye"){shown.has(id)?shown.delete(id):shown.add(id);render()}
    else if(a==="copy"){try{await navigator.clipboard.writeText(pwds[id]||"");toast("Mot de passe copié")}catch(_){shown.add(id);render();toast("Copie impossible — mot de passe affiché")}}
  });

  // ---------- code secret ----------
  const fl=$("#formLock"), dl=$("#dlgLock");
  function openLock(){
    if(!coll)return;
    fl.reset(); $("#lockErr").textContent="";
    const creating=!settings;
    $("#lockTitle").textContent=creating?"Créer votre code secret":"Déverrouiller les mots de passe";
    $("#lockIntro").textContent=creating
      ?"Ce code chiffre les mots de passe Starlink avant la synchronisation. Vous le saisirez une fois sur chaque appareil. S'il est oublié, les mots de passe ne peuvent pas être récupérés : gardez aussi une sauvegarde."
      :"Entrez le code secret créé sur votre autre appareil.";
    $("#lockConfirmWrap").style.display=creating?"":"none";
    fl.code2.required=creating;
    $("#lockSubmit").textContent=creating?"Créer le code":"Déverrouiller";
    dl.showModal(); fl.code.focus();
  }
  $("#bannerBtn").addEventListener("click",openLock);
  fl.addEventListener("submit",async e=>{
    e.preventDefault();
    const code=fl.code.value;
    if(code.length<4){$("#lockErr").textContent="Le code doit faire au moins 4 caractères.";return}
    if(!settings){
      if(code!==fl.code2.value){$("#lockErr").textContent="Les deux codes ne correspondent pas.";return}
      const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
      const k=await deriveKey(code,salt);
      const s={salt,verif:await encStr(VERIF,k)};
      try{ await coll.doc("settings").set(s); }catch(err){ $("#lockErr").textContent="Enregistrement impossible, réessayez."; return; }
      settings=s; key=k;
    }else if(!(await tryUnlock(code))){ $("#lockErr").textContent="Code incorrect."; return; }
    if(fl.remember.checked) lsSet(LS_CODE,code); else try{localStorage.removeItem(LS_CODE)}catch(_){}
    dl.close(); await decryptAll(); render(); updateBanner(); toast("Mots de passe synchronisés");
  });

  // ---------- backup ----------
  $("#btnExport").addEventListener("click",async()=>{
    const data=JSON.stringify({version:1,exporte:new Date().toISOString(),clients:clients.map(c=>({...c,mdp:pwds[c.id]||""}))},null,2);
    const name="sauvegarde-starlink-"+iso(today())+".json";
    try{
      const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Sauvegarde téléchargée : "+name);
    }catch(_){ try{ await navigator.clipboard.writeText(data); toast("Sauvegarde copiée dans le presse-papiers"); }catch(__){ toast("Sauvegarde impossible"); } }
  });
  $("#btnImport").addEventListener("click",()=>$("#fileImport").click());
  $("#fileImport").addEventListener("change",async e=>{
    const f=e.target.files[0]; e.target.value=""; if(!f)return;
    try{
      const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:j.clients;
      if(!Array.isArray(arr))throw 0;
      if(!confirm(`Restaurer ${arr.length} client(s) ? Les clients existants avec le même identifiant seront remplacés.`))return;
      for(const r of arr){
        const c={...r}; c.id=(c.id&&String(c.id).startsWith("c_"))?c.id:newId();
        if(c.mdp)pwds[c.id]=c.mdp; delete c.mdp; c.hist=Array.isArray(c.hist)?c.hist:[];
        delete c.mdpEnc; savePwds();
        const cc=key?await withEnc(c):c;
        const i=clients.findIndex(x=>x.id===cc.id); if(i>=0)clients[i]=cc; else clients.push(cc);
        await persist(cc);
      }
      savePwds(); render(); toast(arr.length+" client(s) restauré(s)");
    }catch(_){ toast("Fichier de sauvegarde invalide"); }
  });
})();
</script>

<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
</script>
